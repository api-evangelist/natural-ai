aid: natural-ai
name: Natural AI
description: >-
  Natural (natural.com) is the agentic payments platform: one API for AI agents,
  apps, and businesses to send, receive, and manage money. Agents get FDIC-insured
  wallets, credit lines, and the ability to pay or request funds by email, phone,
  @handle, party, or agent ID, plus card issuing, merchant acceptance, and
  PCI-compliant voice payments. The REST API (api.natural.com, Bearer auth, JSON:API
  envelope) is complemented by first-party Python and TypeScript SDKs, a `natural`
  CLI, and a hosted Model Context Protocol server at mcp.natural.com exposing 24
  intent-shaped tools with OAuth 2.1 + PKCE. Natural was surfaced as a portfolio
  company of Forerunner Ventures and enriched into the API Evangelist network.

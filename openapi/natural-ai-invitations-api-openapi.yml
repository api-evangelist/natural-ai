openapi: 3.1.1
info:
  title: Natural Agent Keys Invitations API
  version: 0.2.0
  description: 'Natural''s payments API for autonomous agents.


    **Base URL:** `https://api.natural.com`


    AI agents, including coding agents, should prefer the hosted MCP server at `https://mcp.natural.com` when an MCP-aware host runs the agent, the Natural CLI for terminal/CI workflows, and the official SDKs for application runtimes they own. Use direct HTTP only for explicit low-level integrations, unsupported SDK gaps, or infrastructure work where REST is required.


    For support: support@natural.com'
servers:
- url: https://api.natural.com
  description: Production
tags:
- name: Invitations
  description: Party invitation management
paths:
  /party-invitations:
    post:
      operationId: invitations.create
      summary: Create party invitations
      description: Invite people to join the party. Available for business parties.
      tags:
      - Invitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        invitations:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            properties:
                              email:
                                type: string
                                maxLength: 80
                                format: email
                                description: Email address to invite.
                              role:
                                enum:
                                - ADMIN
                                - MEMBER
                                type: string
                                description: Role to assign on acceptance.
                            required:
                            - email
                            - role
                            additionalProperties: false
                            title: InvitationItem
                            description: Single invitation in batch request.
                          description: List of invitations to create (max 100).
                      required:
                      - invitations
                      additionalProperties: false
                      title: InvitationCreateAttributes
                  required:
                  - attributes
                  additionalProperties: false
                  title: InvitationCreateData
              required:
              - data
              additionalProperties: false
              title: CreateInvitationsInput
            examples:
              default:
                summary: Default
                value:
                  data:
                    attributes:
                      invitations:
                      - email: engineer@velocitylogistics.com
                        role: MEMBER
                      - email: cfo@velocitylogistics.com
                        role: ADMIN
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - invitation
                        id:
                          type: string
                          pattern: ^inv_[0-9a-f]{32}$
                          description: Invitation ID (inv_*).
                        attributes:
                          type: object
                          properties:
                            email:
                              type: string
                              description: Invitee email address.
                            role:
                              enum:
                              - OWNER
                              - ADMIN
                              - MEMBER
                              type: string
                              description: Role assigned on acceptance.
                            status:
                              enum:
                              - PENDING
                              - ACCEPTED
                              - REVOKED
                              - DECLINED
                              type: string
                              description: Invitation status.
                            expiresAt:
                              type: string
                              description: When this invitation expires.
                            createdAt:
                              type: string
                              description: When this invitation was created.
                            acceptedAt:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: When this invitation was accepted.
                          required:
                          - email
                          - role
                          - status
                          - expiresAt
                          - createdAt
                          - acceptedAt
                          additionalProperties: false
                          title: InvitationAttributes
                      required:
                      - type
                      - id
                      - attributes
                      additionalProperties: false
                      title: InvitationResource
                    description: Successfully created invitation resources.
                  meta:
                    type: object
                    properties:
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                              description: Email address that could not be invited.
                            error:
                              type: string
                              description: Reason the invitation failed.
                          required:
                          - email
                          - error
                          additionalProperties: false
                          title: InvitationResult
                          description: Failed invitation result.
                        description: Failed invitation attempts with error details.
                    required:
                    - failed
                    additionalProperties: false
                    title: CreateInvitationsMeta
                    description: Batch invitation metadata.
                required:
                - data
                - meta
                additionalProperties: false
                title: CreateInvitationsOutput
              examples:
                default:
                  summary: Default
                  value:
                    data:
                    - type: invitation
                      id: inv_019cd4a832f37c4b8a1d63e94b7c8d12
                      attributes:
                        email: engineer@velocitylogistics.com
                        role: MEMBER
                        status: PENDING
                        expiresAt: '2026-01-11T15:30:00Z'
                        createdAt: '2026-01-04T15:30:00Z'
                        acceptedAt: null
                    meta:
                      failed:
                      - email: cfo@velocitylogistics.com
                        error: User is already a member of this party
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when rate limit resets.
              schema:
                type: integer
        '400':
          description: Validation Error

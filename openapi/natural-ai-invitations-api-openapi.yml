  /party-invitations/{invitationId}:
    delete:
      operationId: invitations.revoke
      summary: Revoke party invitation
      description: Revoke a pending party invitation
      tags:
      - Invitations
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          description: Invitation ID (inv_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - invitation
                      id:
                        type: string
                        pattern: ^inv_[0-9a-f]{32}$
                        description: Invitation ID (inv_*).
                      attributes:
                        type: object
                        properties:
                          email:
                            type: string
                            description: Invitee email address.
                          role:
                            enum:
                            - OWNER
                            - ADMIN
                            - MEMBER
                            type: string
                            description: Role assigned on acceptance.
                          status:
                            enum:
                            - PENDING
                            - ACCEPTED
                            - REVOKED
                            - DECLINED
                            type: string
                            description: Invitation status.
                          expiresAt:
                            type: string
                            description: When this invitation expires.
                          createdAt:
                            type: string
                            description: When this invitation was created.
                          acceptedAt:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: When this invitation was accepted.
                        required:
                        - email
                        - role
                        - status
                        - expiresAt
                        - createdAt
                        - acceptedAt
                        additionalProperties: false
                        title: InvitationAttributes
                    required:
                    - type
                    - id
                    - attributes
                    additionalProperties: false
                    title: InvitationResource
                  meta:
                    type: object
                    properties:
                      deleted:
                        const: true
                        description: Indicates the resource was deleted.
                    required:
                    - deleted
                    additionalProperties: false
                    title: DeletedMeta
                required:
                - data
                - meta
                additionalProperties: false
                title: InvitationRevokeResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: invitation
                      id: inv_019cd4a832f37c4b8a1d63e94b7c8d12
                      attributes:
                        email: engineer@velocitylogistics.com
                        role: MEMBER
                        status: REVOKED
                        expiresAt: '2026-01-11T15:30:00Z'
                        createdAt: '2026-01-04T15:30:00Z'
                        acceptedAt: null
                    meta:
                      deleted: true
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when rate limit resets.
              schema:
                type: integer

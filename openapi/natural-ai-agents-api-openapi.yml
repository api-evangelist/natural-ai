openapi: 3.1.1
info:
  title: Natural Agent Keys Agents API
  version: 0.2.0
  description: 'Natural''s payments API for autonomous agents.


    **Base URL:** `https://api.natural.com`


    AI agents, including coding agents, should prefer the hosted MCP server at `https://mcp.natural.com` when an MCP-aware host runs the agent, the Natural CLI for terminal/CI workflows, and the official SDKs for application runtimes they own. Use direct HTTP only for explicit low-level integrations, unsupported SDK gaps, or infrastructure work where REST is required.


    For support: support@natural.com'
servers:
- url: https://api.natural.com
  description: Production
tags:
- name: Agents
  description: Agent management
paths:
  /agents:
    post:
      operationId: agents.create
      summary: Create agent
      description: Create an agent
      tags:
      - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 32
                          description: Agent display name.
                        description:
                          type: string
                          maxLength: 100
                          description: Agent description.
                        slug:
                          type: string
                          pattern: ^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]$
                          description: Agent-specific part of the handle, such as support in @acme-support.
                        limits:
                          type: object
                          properties:
                            perTransaction:
                              anyOf:
                              - type: integer
                                exclusiveMinimum: 0
                              - type: 'null'
                              description: Per-transaction spending limit in cents, or null for no limit.
                            perDay:
                              anyOf:
                              - type: integer
                                exclusiveMinimum: 0
                              - type: 'null'
                              description: Daily spending limit in cents, or null for no limit.
                            perMonth:
                              anyOf:
                              - type: integer
                                exclusiveMinimum: 0
                              - type: 'null'
                              description: Monthly spending limit in cents, or null for no limit.
                          additionalProperties: false
                          description: Agent spending limits. Agent credentials cannot set them.
                        walletId:
                          type: string
                          pattern: ^wal_[0-9a-f]{32}$
                          description: Wallet the agent is granted access to. Defaults to the party's default wallet when omitted.
                      required:
                      - name
                      additionalProperties: false
                  required:
                  - attributes
                  additionalProperties: false
              required:
              - data
              additionalProperties: false
              title: AgentCreateRequest
            examples:
              default:
                summary: Default
                value:
                  data:
                    attributes:
                      name: Carrier Payment Agent v2.1
                      description: Autonomous agent that pays delivery carriers
                      slug: carrier_payments
                      limits:
                        perTransaction: 100000
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - agent
                      id:
                        type: string
                        pattern: ^agt_[0-9a-f]{32}$
                        description: Agent ID (agt_*).
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Agent display name.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Agent description.
                          handle:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Agent handle, such as @acme-support, or null if none is configured.
                          status:
                            enum:
                            - ACTIVE
                            - REVOKED
                            type: string
                            description: Agent status.
                          limits:
                            anyOf:
                            - type: object
                              properties:
                                perTransaction:
                                  anyOf:
                                  - type: integer
                                    exclusiveMinimum: 0
                                  - type: 'null'
                                  description: Per-transaction spending limit in cents, or null for no limit.
                                perDay:
                                  anyOf:
                                  - type: integer
                                    exclusiveMinimum: 0
                                  - type: 'null'
                                  description: Daily spending limit in cents, or null for no limit.
                                perMonth:
                                  anyOf:
                                  - type: integer
                                    exclusiveMinimum: 0
                                  - type: 'null'
                                  description: Monthly spending limit in cents, or null for no limit.
                              additionalProperties: false
                              title: AgentOwnerLimits
                            - type: 'null'
                            description: Spend caps for actions this agent initiates on its owner's party.
                          createdAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: When this agent was created.
                          createdBy:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: User who created this agent (usr_*).
                          lastActiveAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: When the agent last authenticated, or null if it has never authenticated.
                        required:
                        - name
                        - description
                        - handle
                        - status
                        - limits
                        - createdAt
                        - createdBy
                        - lastActiveAt
                        additionalProperties: false
                        title: AgentAttributes
                      relationships:
                        type: object
                        properties:
                          party:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - party
                                  id:
                                    type: string
                                    pattern: ^pty_[0-9a-f]{32}$
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            title: ToOneRelationship
                            description: Party that owns the agent.
                        required:
                        - party
                        additionalProperties: false
                        title: AgentRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: AgentResource
                required:
                - data
                additionalProperties: false
                title: AgentResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: agent
                      id: agt_3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
                      attributes:
                        name: Carrier Payment Agent v2.1
                        description: Autonomous agent that pays delivery carriers
                        handle: '@natural-carrier_payments'
                        status: ACTIVE
                        limits:

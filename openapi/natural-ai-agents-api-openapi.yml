    delete:
      operationId: agents.remove
      summary: Delete agent
      description: Delete an agent and revoke its active customer authorizations and pending invitations
      tags:
      - Agents
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^agt_[0-9a-f]{32}$
          description: Agent ID (agt_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - agent
                      id:
                        type: string
                        pattern: ^agt_[0-9a-f]{32}$
                        description: Agent ID (agt_*).
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Agent display name.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Agent description.
                          handle:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Agent handle, such as @acme-support, or null if none is configured.
                          status:
                            enum:
                            - ACTIVE
                            - REVOKED
                            type: string
                            description: Agent status.
                          limits:
                            anyOf:
                            - type: object
                              properties:
                                perTransaction:
                                  anyOf:
                                  - type: integer
                                    exclusiveMinimum: 0
                                  - type: 'null'
                                  description: Per-transaction spending limit in cents, or null for no limit.
                                perDay:
                                  anyOf:
                                  - type: integer
                                    exclusiveMinimum: 0
                                  - type: 'null'
                                  description: Daily spending limit in cents, or null for no limit.
                                perMonth:
                                  anyOf:
                                  - type: integer
                                    exclusiveMinimum: 0
                                  - type: 'null'
                                  description: Monthly spending limit in cents, or null for no limit.
                              additionalProperties: false
                              title: AgentOwnerLimits
                            - type: 'null'
                            description: Spend caps for actions this agent initiates on its owner's party.
                          createdAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: When this agent was created.
                          createdBy:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: User who created this agent (usr_*).
                          lastActiveAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: When the agent last authenticated, or null if it has never authenticated.
                        required:
                        - name
                        - description
                        - handle
                        - status
                        - limits
                        - createdAt
                        - createdBy
                        - lastActiveAt
                        additionalProperties: false
                        title: AgentAttributes
                      relationships:
                        type: object
                        properties:
                          party:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - party
                                  id:
                                    type: string
                                    pattern: ^pty_[0-9a-f]{32}$
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            title: ToOneRelationship
                            description: Party that owns the agent.
                        required:
                        - party
                        additionalProperties: false
                        title: AgentRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: AgentResource
                  meta:
                    type: object
                    properties:
                      deleted:
                        const: true
                        description: Indicates the resource was deleted.
                    required:
                    - deleted
                    additionalProperties: false
                    title: DeletedMeta
                required:
                - data
                - meta
                additionalProperties: false
                title: AgentRevokeResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: agent
                      id: agt_3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
                      attributes:
                        name: Carrier Payment Agent v2.1

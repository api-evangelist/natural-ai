  /webhooks/{webhookId}:
    get:
      operationId: webhooks.get
      summary: Get webhook
      description: Get a webhook endpoint
      tags:
      - Webhooks
      parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          description: Webhook ID (whk_*).
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - webhook
                      id:
                        type: string
                        description: Webhook ID (whk_*).
                      attributes:
                        type: object
                        properties:
                          url:
                            type: string
                            format: uri
                            description: Webhook endpoint URL.
                          description:
                            type: string
                            description: Webhook description.
                          status:
                            enum:
                            - ENABLED
                            - DISABLED
                            type: string
                            description: Webhook status.
                          enabledEvents:
                            type: array
                            items:
                              enum:
                              - '*'
                              - party.updated
                              - compliance_case.updated
                              - wallet.created
                              - external_account.connected
                              - agent_delegation_invitation.created
                              - agent_delegation_invitation.accepted
                              - agent_delegation_invitation.declined
                              - agent_delegation_invitation.canceled
                              - agent_delegation.revoked
                              - delegation.activated
                              - delegation.revoked
                              - deposit.created
                              - deposit.completed
                              - deposit.failed
                              - deposit.returned
                              - deposit.canceled
                              - deposit.approval_denied
                              - withdrawal.created
                              - withdrawal.completed
                              - withdrawal.failed
                              - withdrawal.returned
                              - withdrawal.canceled
                              - withdrawal.approval_denied
                              - payment.created
                              - payment.completed
                              - payment.failed
                              - payment.returned
                              - payment.canceled
                              - payment.approval_denied
                              - approval.required
                              - approval.approved
                              - approval.denied
                              - approval.canceled
                              - payment_request.created
                              - payment_request.completed
                              - payment_request.canceled
                              - payment_request.declined
                              - payment_request.incoming
                              type: string
                            description: Event types this webhook listens to.
                          tags:
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties:
                              type: string
                            description: Metadata visible to anyone who can read the resource.
                          createdAt:
                            type: string
                            format: date-time
                            description: When this webhook was created.
                          updatedAt:
                            type: string
                            format: date-time
                            description: When this webhook was last updated.
                        required:
                        - url
                        - description
                        - status
                        - enabledEvents
                        - tags
                        - createdAt
                        - updatedAt
                        additionalProperties: false
                        title: WebhookAttributes
                      relationships:
                        type: object
                        properties:
                          party:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - party
                                  id:
                                    type: string
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            title: ToOneRelationship
                            description: Party that owns the webhook.
                        required:
                        - party
                        additionalProperties: false
                        title: WebhookRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: WebhookResource
                required:
                - data
                additionalProperties: false
                title: WebhookSingleResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: webhook
                      id: whk_0192abc1def2789034567890abcdef12
                      attributes:
                        url: https://example.com/webhooks/natural
                        description: Production webhook for wallet and party events
                        status: ENABLED
                        enabledEvents:
                        - wallet.created
                        - party.updated
                        - delegation.activated

  /webhooks/{webhookId}/rotate-secret:
    post:
      operationId: webhooks.rotateSecret
      summary: Rotate webhook signing secret
      description: Generate a new signing secret.
      tags:
      - Webhooks
      parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          description: Webhook ID (whk_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        expiresInSeconds:
                          type: integer
                          minimum: 0
                          maximum: 86400
                          description: Grace period in seconds for the previous secret (0 = immediate cutover, max 86400).
                      required:
                      - expiresInSeconds
                      additionalProperties: false
                      title: RotateSecretAttributes
                  required:
                  - attributes
                  additionalProperties: false
                  title: RotateSecretData
              required:
              - data
              additionalProperties: false
              title: RotateSecretInput
            examples:
              default:
                summary: Default
                value:
                  data:
                    attributes:
                      expiresInSeconds: 3600
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - webhook
                      id:
                        type: string
                        description: Webhook ID (whk_*).
                      attributes:
                        type: object
                        properties:
                          signingSecret:
                            type: string
                            description: New webhook signing secret. Returned only once.
                          previousSecretExpiresAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: When the previous secret expires, or null for immediate cutover.
                        required:
                        - signingSecret
                        - previousSecretExpiresAt
                        additionalProperties: false
                        title: RotateSecretResponseAttributes
                      relationships:
                        type: object
                        properties:
                          party:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - party
                                  id:
                                    type: string
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            title: ToOneRelationship
                            description: Party that owns the webhook.
                        required:
                        - party
                        additionalProperties: false
                        title: WebhookRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: RotateSecretResource
                required:
                - data
                additionalProperties: false
                title: RotateSecretResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: webhook
                      id: whk_0192abc1def2789034567890abcdef12
                      attributes:
                        signingSecret: whsec_7Yp2KdN9wL4xT8rE1cV5bM0aQ6hJ3fG8
                        previousSecretExpiresAt: '2026-03-17T09:15:00Z'
                      relationships:
                        party:
                          data:
                            type: party
                            id: pty_7c9e6679e29b41d4a716446655440001
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.

openapi: 3.1.1
info:
  title: Natural Agent Keys API
  version: 0.2.0
  description: 'Natural''s payments API for autonomous agents.


    **Base URL:** `https://api.natural.com`


    AI agents, including coding agents, should prefer the hosted MCP server at `https://mcp.natural.com` when an MCP-aware host runs the agent, the Natural CLI for terminal/CI workflows, and the official SDKs for application runtimes they own. Use direct HTTP only for explicit low-level integrations, unsupported SDK gaps, or infrastructure work where REST is required.


    For support: support@natural.com'
servers:
- url: https://api.natural.com
  description: Production
tags:
- name: Agent Keys
  description: Agent key management
paths:
  /agent-keys:
    get:
      operationId: agentKeys.list
      summary: List agent keys
      description: List agent keys
      tags:
      - Agent Keys
      parameters:
      - name: agentId
        in: query
        schema:
          type: string
          pattern: ^agt_[0-9a-f]{32}$
          description: Filter to keys bound to this agent (agt_*).
        allowEmptyValue: true
        allowReserved: true
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
          description: Cursor from the previous page.
        allowEmptyValue: true
        allowReserved: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum results per page.
        allowEmptyValue: true
        allowReserved: true
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - agentKey
                        id:
                          type: string
                          description: Agent key ID (agk_*).
                        attributes:
                          type: object
                          properties:
                            agentKeyPrefix:
                              type: string
                              description: Non-secret prefix of the agent key, e.g. `ak_ntl_prod_abc123`.
                            status:
                              enum:
                              - ACTIVE
                              - REVOKED
                              type: string
                              description: Status (ACTIVE or REVOKED).
                            createdAt:
                              type: string
                              format: date-time
                              description: When this key was created.
                            lastUsedAt:
                              anyOf:
                              - type: string
                                format: date-time
                              - type: 'null'
                              description: When this key was last used.
                            revokedAt:
                              anyOf:
                              - type: string
                                format: date-time
                              - type: 'null'
                              description: When this key was revoked.
                            createdBy:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: User who created this key (usr_*).
                            revokedBy:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: User who revoked this key (usr_*).
                            expiresAt:
                              anyOf:
                              - type: string
                                format: date-time
                              - type: 'null'
                              description: When this key stops authenticating, or null if it has no scheduled expiration.
                          required:
                          - agentKeyPrefix
                          - status
                          - createdAt
                          - lastUsedAt
                          - revokedAt
                          - createdBy
                          - revokedBy
                          - expiresAt
                          additionalProperties: false
                          title: AgentKeyAttributes
                        relationships:
                          type: object
                          properties:
                            party:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                              required:
                              - data
                              additionalProperties: false
                              title: ToOneRelationship
                              description: Party that owns the agent key.
                            agent:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - agent
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                              required:
                              - data
                              additionalProperties: false
                              title: ToOneRelationship
                              description: Agent this key is bound to.
                          required:
                          - party
                          - agent
                          additionalProperties: false
                          title: AgentKeyRelationships
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      additionalProperties: false
                      title: AgentKeyResource

  /approvals/{approvalId}:
    get:
      operationId: approvals.get
      summary: Get approval
      description: Get an approval
      tags:
      - Approvals
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          pattern: ^apr_[0-9a-f]{32}$
          description: Approval ID (apr_*).
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - approval
                      id:
                        type: string
                        description: Approval ID (apr_*).
                      attributes:
                        type: object
                        properties:
                          status:
                            enum:
                            - pending
                            - approved
                            - denied
                            - canceled
                            type: string
                            description: Approval status.
                          target:
                            type: object
                            properties:
                              type:
                                enum:
                                - payment
                                - deposit
                                - withdrawal
                                type: string
                                description: Type of operation under approval.
                              id:
                                type: string
                                description: ID of the operation under approval.
                            required:
                            - type
                            - id
                            additionalProperties: false
                            description: Operation that needs approval.
                          payment:
                            anyOf:
                            - type: object
                              properties:
                                amount:
                                  type: integer
                                  description: Amount in cents.
                                currency:
                                  type: string
                                  description: Currency code.
                              required:
                              - amount
                              - currency
                              additionalProperties: false
                            - type: 'null'
                            description: Amount of the operation under review. Null when the underlying amount is unavailable.
                          reasons:
                            type: array
                            items:
                              anyOf:
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - limitExceeded
                                  limitType:
                                    enum:
                                    - perTransactionAmount
                                    - dailyAmount
                                    - monthlyAmount
                                    type: string
                                    description: Type of limit that was exceeded.
                                  limitAmount:
                                    type: integer
                                    description: Configured limit amount in cents.
                                  actualAmount:
                                    type: integer
                                    description: Amount that exceeded the limit, in cents.
                                  currency:
                                    type: string
                                    description: Currency code.
                                required:
                                - type
                                - limitType
                                - limitAmount
                                - actualAmount
                                - currency
                                additionalProperties: false
                            description: Reasons this approval is under review.
                          customer:
                            anyOf:
                            - type: object
                              properties:
                                id:
                                  type: string
                                  pattern: ^pty_[0-9a-f]{32}$
                                  description: Customer party (pty_*) whose wallet a delegated payment spends from.
                                name:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                  description: Display name of the customer party, or null when unresolved.
                              required:
                              - id
                              - name
                              additionalProperties: false
                            - type: 'null'
                            description: Customer the agent is spending on behalf of, or null when the approval isn't a delegated payment.
                          createdAt:
                            type: string
                            description: When the approval was created.
                          updatedAt:
                            type: string
                            description: When the approval was last updated.
                          resolvedAt:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: When the approval was resolved.
                        required:
                        - status
                        - target
                        - payment
                        - reasons
                        - customer
                        - createdAt
                        - updatedAt
                        - resolvedAt
                        additionalProperties: false
                    required:
                    - type
                    - id
                    - attributes
                    additionalProperties: false
                required:
                - data
                additionalProperties: false
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: approval
                      id: apr_550e8400e29b41d4a716446655440000
                      attributes:
                        status: pending
                        target:
                          type: payment
                          id: pay_550e8400e29b41d4a716446655440001
                        payment:
                          amount: 500000
                          currency: USD
                        reasons:
                        - type: limitExceeded
                          limitType: perTransactionAmount
                          limitAmount: 250000
                          actualAmount: 500000
                          currency: USD
                        customer: null
                        createdAt: '2026-01-04T15:30:00.000Z'
                        updatedAt: '2026-01-04T15:30:00.000Z'
                        resolvedAt: null
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when rate limit resets.
              schema:
                type: integer

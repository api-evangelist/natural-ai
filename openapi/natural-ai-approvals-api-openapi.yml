  /approvals/{approvalId}/deny:
    post:
      operationId: approvals.deny
      summary: Deny payment or transfer
      description: Deny the payment or transfer under review
      tags:
      - Approvals
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          pattern: ^apr_[0-9a-f]{32}$
          description: Approval ID (apr_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.

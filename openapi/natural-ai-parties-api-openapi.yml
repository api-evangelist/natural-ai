  /parties/{partyId}/compliance:
    get:
      operationId: parties.getCompliance
      summary: Get party compliance
      description: Get a party's current compliance status
      tags:
      - Parties
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          pattern: ^pty_[0-9a-f]{32}$
          description: Party ID (pty_*).
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                          description: Compliance case ID.
                        type:

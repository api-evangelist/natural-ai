  /parties/me/handle:
    put:
      operationId: parties.setHandle
      summary: Set party handle
      description: Set or rename your party's handle; it can never be cleared
      tags:
      - Parties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        handle:
                          type: string
                          maxLength: 30
                          pattern: ^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]$
                          description: Party handle without the "@" prefix, such as "acme". Renames the handle; it cannot be cleared. For 14 days after a rename, only the same party can reclaim the released name.
                      required:
                      - handle
                      additionalProperties: false
                  required:
                  - attributes
                  additionalProperties: false
              required:
              - data
              additionalProperties: false
              title: SetPartyHandleInput
            examples:

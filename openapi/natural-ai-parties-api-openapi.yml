      operationId: parties.disableLimits
      summary: Disable party approval limits
      description: Disable all approval limits for the party
      tags:
      - Parties
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - partyLimitPolicy
                      id:
                        type: string
                        pattern: ^pty_[0-9a-f]{32}$
                      attributes:
                        type: object
                        properties:
                          limits:
                            anyOf:
                            - type: object
                              properties:
                                perTransaction:
                                  anyOf:
                                  - type: integer
                                  - type: 'null'
                                  description: Per-transaction spend cap in cents, or null when unset.
                                perDay:
                                  anyOf:
                                  - type: integer
                                  - type: 'null'
                                  description: Daily (UTC) spend cap in cents, or null when unset.

  /transactions/{transactionId}:
    get:
      operationId: transactions.get
      summary: Get transaction
      description: Get a transaction
      tags:
      - Transactions
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^txn_[0-9a-f]{32}$
          description: Transaction ID (txn_*).
      - name: partyId
        in: query
        required: false
        schema:
          type: string
          pattern: ^pty_[0-9a-f]{32}$
          description: Defaults to your party. To act for another party, pass the ID of a party that has authorized you to act on its behalf.
        allowEmptyValue: true
        allowReserved: true
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - transaction
                      id:
                        type: string
                        pattern: ^txn_[0-9a-f]{32}$
                        description: Transaction ID (txn_*).
                      attributes:
                        type: object
                        properties:
                          amount:
                            type: integer
                            description: Amount in cents.
                          currency:
                            type: string
                            description: Currency code.
                          status:
                            type: string
                            description: Transaction status.
                          createdAt:
                            type: string
                            description: When this transaction was created.
                          transactionType:
                            enum:
                            - payment
                            - transfer
                            type: string
                            description: Transaction type.
                          direction:
                            enum:
                            - INBOUND
                            - OUTBOUND
                            type: string
                            description: Direction relative to your party.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Transaction description.
                          updatedAt:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: When this transaction was last updated.
                          expectedAvailableAt:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Projected funds-available time, or null for payments and transfers without a projection.
                        required:
                        - amount
                        - currency
                        - status
                        - createdAt
                        - transactionType
                        - direction
                        - description
                        - updatedAt
                        - expectedAvailableAt
                        additionalProperties: false
                        title: TransactionAttributes
                      relationships:
                        type: object
                        properties:
                          sourceParty:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                      pattern: ^pty_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Source party.
                          destinationParty:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                      pattern: ^pty_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Destination party.
                          payment:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - payment
                                  id:
                                    type: string
                                    pattern: ^pay_[0-9a-f]{32}$
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            description: Related payment, when accessible.
                          transfer:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - transfer
                                  id:
                                    type: string
                                    pattern: ^trf_[0-9a-f]{32}$
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            description: Related transfer, when accessible.
                          wallet:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - wallet
                                  id:
                                    type: string
                                    pattern: ^wal_[0-9a-f]{32}$
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            description: Wallet through which this transaction is visible.
                        required:
                        - sourceParty
                        - destinationParty
                        additionalProperties: false
                        title: TransactionRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: TransactionResource
                required:
                - data
                additionalProperties: false
                title: TransactionSingleResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: transaction
                      id: txn_550e8400e29b41d4a716446655440000
                      attributes:
                        amount: 100000
                        currency: USD
                        status: COMPLETED
                        description: Invoice payment
                        createdAt: '2026-01-04T15:30:00Z'
                        updatedAt: '2026-01-04T15:31:00Z'
                        transactionType: payment
                        direction: OUTBOUND
                        expectedAvailableAt: null
                      relationships:
                        sourceParty:
                          data:
                            type: party
                            id: pty_7c9e6679e29b41d4a716446655440001
                        destinationParty:
                          data:
                            type: party
                            id: pty_7c9e6679e29b41d4a716446655440002
                        payment:
                          data:
                            type: payment
                            id: pay_550e8400e29b41d4a716446655440000
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window.
              schema:
                type: integer

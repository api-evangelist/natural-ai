                            - deposit.created
                            - deposit.completed
                            - deposit.failed
                            - deposit.returned
                            - deposit.canceled
                            - deposit.approval_denied
                            - withdrawal.created
                            - withdrawal.completed
                            - withdrawal.failed
                            - withdrawal.returned
                            - withdrawal.canceled
                            - withdrawal.approval_denied
                            - payment.created
                            - payment.completed
                            - payment.failed
                            - payment.returned
                            - payment.canceled
                            - payment.approval_denied
                            - approval.required
                            - approval.approved
                            - approval.denied
                            - approval.canceled
                            - payment_request.created
                            - payment_request.completed
                            - payment_request.canceled
                            - payment_request.declined
                            - payment_request.incoming
                            type: string
                            description: Type of event.

                              - deposit.failed
                              - deposit.returned
                              - deposit.canceled
                              - deposit.approval_denied
                              - withdrawal.created
                              - withdrawal.completed
                              - withdrawal.failed
                              - withdrawal.returned
                              - withdrawal.canceled
                              - withdrawal.approval_denied
                              - payment.created
                              - payment.completed
                              - payment.failed
                              - payment.returned
                              - payment.canceled
                              - payment.approval_denied
                              - approval.required
                              - approval.approved
                              - approval.denied
                              - approval.canceled
                              - payment_request.created
                              - payment_request.completed
                              - payment_request.canceled
                              - payment_request.declined
                              - payment_request.incoming
                              type: string
                              description: Type of event.
                            resourceId:
                              type: string
                              description: ID of the resource that triggered the event.
                            resourceType:
                              type: string
                              description: Type of the resource (e.g. wallet, payment).
                            payload:
                              type: object
                              properties:
                                object:
                                  description: Point-in-time resource snapshot.
                              additionalProperties: {}
                              description: Event payload containing the resource snapshot. Additional keys may be added in the future.
                            createdAt:
                              type: string
                              format: date-time
                              description: When this event was created.
                          required:
                          - eventType
                          - resourceId
                          - resourceType
                          - payload
                          - createdAt
                          additionalProperties: false
                          title: EventAttributes
                        relationships:
                          type: object
                          properties:
                            party:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                              required:
                              - data
                              additionalProperties: false
                              title: ToOneRelationship
                              description: Party that owns the event.
                          required:
                          - party
                          additionalProperties: false
                          title: EventRelationships
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      additionalProperties: false
                      title: EventResource

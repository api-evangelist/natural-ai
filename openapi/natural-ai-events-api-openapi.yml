openapi: 3.1.1
info:
  title: Natural Agent Keys Events API
  version: 0.2.0
  description: 'Natural''s payments API for autonomous agents.


    **Base URL:** `https://api.natural.com`


    AI agents, including coding agents, should prefer the hosted MCP server at `https://mcp.natural.com` when an MCP-aware host runs the agent, the Natural CLI for terminal/CI workflows, and the official SDKs for application runtimes they own. Use direct HTTP only for explicit low-level integrations, unsupported SDK gaps, or infrastructure work where REST is required.


    For support: support@natural.com'
servers:
- url: https://api.natural.com
  description: Production
tags:
- name: Events
  description: Webhook event log
paths:
  /events:
    get:
      operationId: events.list
      summary: List events
      description: List events
      tags:
      - Events
      parameters:
      - name: partyId
        in: query
        schema:
          type: string
          pattern: ^pty_[0-9a-f]{32}$
          description: Defaults to your party. To act for another party, pass the ID of a party that has authorized you to act on its behalf.
        allowEmptyValue: true
        allowReserved: true
      - name: eventType
        in: query
        schema:
          enum:
          - party.updated
          - compliance_case.updated
          - wallet.created
          - external_account.connected
          - agent_delegation_invitation.created
          - agent_delegation_invitation.accepted
          - agent_delegation_invitation.declined
          - agent_delegation_invitation.canceled
          - agent_delegation.revoked
          - delegation.activated
          - delegation.revoked
          - deposit.created
          - deposit.completed
          - deposit.failed
          - deposit.returned
          - deposit.canceled
          - deposit.approval_denied
          - withdrawal.created
          - withdrawal.completed
          - withdrawal.failed
          - withdrawal.returned
          - withdrawal.canceled
          - withdrawal.approval_denied
          - payment.created
          - payment.completed
          - payment.failed
          - payment.returned
          - payment.canceled
          - payment.approval_denied
          - approval.required
          - approval.approved
          - approval.denied
          - approval.canceled
          - payment_request.created
          - payment_request.completed
          - payment_request.canceled
          - payment_request.declined
          - payment_request.incoming
          type: string
          description: Filter by event type. Required when partyId names another party.
        allowEmptyValue: true
        allowReserved: true
      - name: createdAfter
        in: query
        schema:
          type: string
          maxLength: 64
          format: date-time
          description: Return events created after this timestamp.
        allowEmptyValue: true
        allowReserved: true
      - name: createdBefore
        in: query
        schema:
          type: string
          maxLength: 64
          format: date-time
          description: Return events created before this timestamp.
        allowEmptyValue: true
        allowReserved: true
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
          description: Cursor from the previous page.
        allowEmptyValue: true
        allowReserved: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum results per page.
        allowEmptyValue: true
        allowReserved: true
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.

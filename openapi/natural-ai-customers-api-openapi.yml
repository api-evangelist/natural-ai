  /customers/{customerId}:
    get:
      operationId: customers.get
      summary: Get customer
      description: Get a customer who has authorized an agent
      tags:
      - Customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          pattern: ^pty_[0-9a-f]{32}$
          description: Customer party ID (pty_*).
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - customer
                      id:
                        type: string
                        pattern: ^pty_[0-9a-f]{32}$
                        description: Customer party ID (pty_*).
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Customer name.
                          email:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Email address.
                          avatarUrl:
                            anyOf:
                            - type: string
                              format: uri
                            - type: 'null'
                            description: Public avatar URL, or null if none is set.
                          createdAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: When the customer was created.
                          delegation:
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^dlg_[0-9a-f]{32}$
                                description: Delegation ID (dlg_*).
                              status:
                                enum:
                                - ACTIVE
                                - SUSPENDED
                                - REVOKED
                                - EXPIRED
                                type: string
                                description: Delegation status.
                              permissions:
                                type: array
                                items:
                                  type: string
                                description: Granted permissions.
                              createdAt:
                                type: string
                                format: date-time
                                description: When the customer was connected.
                              revokedAt:
                                anyOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                                description: When access was revoked, or null if not revoked.
                            required:
                            - id
                            - status
                            - permissions
                            - createdAt
                            - revokedAt
                            additionalProperties: false
                            title: CustomerDelegation
                            description: Delegation details.
                          agents:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  pattern: ^agt_[0-9a-f]{32}$
                                  description: Agent ID (agt_*).
                                name:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                  description: Agent name.
                                handle:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                  description: The agent's composed public handle (@namespace-slug), or null when it has none.
                                status:
                                  type: string
                                  description: Connection status.
                                permissions:
                                  type: array
                                  items:
                                    type: string
                                  description: Permissions this agent holds.
                                limits:
                                  anyOf:
                                  - type: object
                                    properties:
                                      perTransaction:
                                        anyOf:
                                        - type: integer
                                          exclusiveMinimum: 0
                                        - type: 'null'
                                        description: Per-transaction spending limit in cents, or null for no limit.
                                      perDay:
                                        anyOf:
                                        - type: integer
                                          exclusiveMinimum: 0
                                        - type: 'null'
                                        description: Daily spending limit in cents, or null for no limit.
                                      perMonth:
                                        anyOf:
                                        - type: integer
                                          exclusiveMinimum: 0
                                        - type: 'null'
                                        description: Monthly spending limit in cents, or null for no limit.
                                    additionalProperties: false
                                    title: ConnectedAgentLimits
                                  - type: 'null'
                                  description: Spending limits in cents (per-transaction, daily, monthly) for this agent.
                              required:
                              - id
                              - name
                              - handle
                              - status
                              - permissions
                              - limits
                              additionalProperties: false
                              title: CustomerConnectedAgent
                            description: Connected agents.
                        required:
                        - name
                        - email
                        - avatarUrl
                        - createdAt
                        - delegation
                        - agents
                        additionalProperties: false
                        title: CustomerActiveAttributes
                    required:
                    - type
                    - id
                    - attributes
                    additionalProperties: false
                    title: CustomerActiveResource
                    description: Customer connection, including revoked connections when requested.
                required:
                - data
                additionalProperties: false
                title: CustomerResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      id: pty_4a8c9823f39c42a5b817556766551112
                      type: customer
                      attributes:
                        name: Acme Co
                        email: ops@acme.com
                        avatarUrl: https://static.natural.com/avatars/acme-co.png
                        createdAt: '2026-01-04T15:30:00.000Z'
                        delegation:
                          id: dlg_550e8400e29b41d4a716446655440000
                          status: ACTIVE
                          permissions:
                          - payments.read
                          createdAt: '2026-01-10T12:00:00.000Z'
                          revokedAt: null
                        agents:
                        - id: agt_3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
                          name: Invoice Agent
                          handle: '@acme-invoice'
                          status: ACTIVE
                          permissions:
                          - payments.read
                          limits:
                            perTransaction: 100000
                            perDay: 500000
                            perMonth: 2000000
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when rate limit resets.
              schema:
                type: integer

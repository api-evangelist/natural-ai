  /customers/invitations:
    get:
      operationId: customers.listInvitations
      summary: List customer invitations
      description: List pending customer invitations
      tags:
      - Customers
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
          description: Cursor from the previous page.
        allowEmptyValue: true
        allowReserved: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Maximum results per page.
        allowEmptyValue: true
        allowReserved: true
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - customerInvitation
                        id:
                          type: string
                          description: Recipient email.
                        attributes:
                          type: object
                          properties:
                            status:
                              type: string
                              description: Invitation status.
                            party:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                    pattern: ^pty_[0-9a-f]{32}$
                                    description: Customer party ID (pty_*).
                                  name:
                                    type: string
                                    description: Customer name.
                                  email:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    description: Email address.
                                  avatarUrl:
                                    anyOf:
                                    - type: string
                                      format: uri
                                    - type: 'null'
                                    description: Public avatar URL, or null if none is set.
                                  createdAt:
                                    anyOf:
                                    - type: string
                                      format: date-time
                                    - type: 'null'
                                    description: When the customer was created.
                                required:
                                - id
                                - name
                                - email
                                - avatarUrl
                                - createdAt
                                additionalProperties: false
                                title: CustomerParty
                              - type: 'null'
                              description: Customer party, or null if they haven't signed up yet.
                            email:
                              type: string
                              description: Recipient email.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the invitation was created.
                            agentInvitations:
                              type: array
                              items:
                                type: object
                                properties:
                                  invitationId:
                                    type: string
                                    pattern: ^adi_[0-9a-f]{32}$
                                    description: Invitation ID (adi_*).
                                  agent:
                                    type: object
                                    properties:
                                      id:
                                        type: string
                                        pattern: ^agt_[0-9a-f]{32}$
                                        description: Agent ID (agt_*).
                                      name:
                                        anyOf:
                                        - type: string
                                        - type: 'null'
                                        description: Agent name.
                                      handle:
                                        anyOf:
                                        - type: string
                                        - type: 'null'
                                        description: The agent's composed public handle (@namespace-slug), or null when it has none.
                                    required:
                                    - id
                                    - name
                                    - handle
                                    additionalProperties: false
                                    title: CustomerAgent
                                    description: Invited agent.
                                  permissions:
                                    type: array
                                    items:
                                      type: string
                                    description: Permissions requested for this agent.
                                  url:
                                    type: string
                                    format: uri
                                    description: Invitation URL. Natural sends it automatically for email invitations; deliver it yourself for phone invitations.
                                  createdAt:
                                    type: string
                                    format: date-time
                                    description: When the invitation was created.
                                  expiresAt:
                                    anyOf:
                                    - type: string
                                      format: date-time
                                    - type: 'null'
                                    description: When the invitation expires, or null if it does not expire.
                                  tags:
                                    type: object
                                    propertyNames:
                                      type: string
                                    additionalProperties:
                                      type: string
                                    description: Metadata visible to anyone who can read the resource.
                                required:
                                - invitationId
                                - agent
                                - permissions
                                - url
                                - createdAt
                                - expiresAt
                                - tags
                                additionalProperties: false
                                title: AgentInvitation
                              description: Agent invitations sent to this recipient.
                          required:
                          - status
                          - party
                          - email
                          - createdAt
                          - agentInvitations
                          additionalProperties: false
                          title: CustomerInvitationAttributes
                      required:
                      - type
                      - id
                      - attributes
                      additionalProperties: false
                      title: CustomerInvitationResource
                      description: Pending customer invitation grouped by recipient.
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          hasMore:
                            type: boolean
                            description: Whether more results are available.
                          nextCursor:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Cursor for the next page, or null when there are no more results.
                        required:
                        - hasMore
                        - nextCursor
                        additionalProperties: false
                        title: PaginationMeta
                    required:
                    - pagination
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
                title: PendingInvitationListResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                    - type: customerInvitation
                      id: ops@acme.com
                      attributes:
                        status: PENDING
                        party: null
                        email: ops@acme.com
                        createdAt: '2026-01-05T10:15:00.000Z'
                        agentInvitations:
                        - invitationId: adi_550e8400e29b41d4a716446655440000
                          agent:
                            id: agt_3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
                            name: Invoice Agent
                            handle: '@acme-invoice'

  /payments/{paymentId}/cancel:
    post:
      operationId: payments.cancel
      summary: Cancel payment
      description: Cancel a payment before the recipient begins claiming it
      tags:
      - Payments
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^pay_[0-9a-f]{32}$
          description: Payment ID (pay_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - payment
                      id:
                        type: string
                        pattern: ^pay_[0-9a-f]{32}$
                      attributes:
                        type: object
                        properties:
                          amount:
                            type: integer
                            description: Amount in cents.
                          currency:
                            type: string
                            description: Currency code.
                          status:
                            enum:
                            - CREATED
                            - PROCESSING
                            - PENDING_CLAIM
                            - IN_REVIEW
                            - COMPLETED
                            - FAILED
                            - RETURNED
                            - APPROVAL_DENIED
                            - CANCELED
                            type: string
                            description: Payment status.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Payment description.
                          createdAt:
                            type: string
                            description: When this payment was created.
                          updatedAt:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: When this payment was last updated.
                        required:
                        - amount
                        - currency
                        - status
                        - description
                        - createdAt
                        - updatedAt
                        additionalProperties: false
                        title: PaymentAttributes
                      relationships:
                        type: object
                        properties:
                          sender:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                      pattern: ^pty_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Party that initiated the payment, when the sender is on Natural.
                          senderAgent:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - agent
                                    id:
                                      type: string
                                      pattern: ^agt_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Sending agent, or null when the payment was not sent by an agent.
                          recipient:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                      pattern: ^pty_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Recipient party for this payment, when known.
                          recipientAgent:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - agent
                                    id:
                                      type: string
                                      pattern: ^agt_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Recipient agent, or null unless addressed by agent ID or agent handle.
                          transaction:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - transaction
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Sender-side transaction for this payment, when available.
                          paymentRequest:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - paymentRequest
                                    id:
                                      type: string
                                      pattern: ^prq_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Payment request that produced this payment, when applicable.
                        required:
                        - sender
                        - senderAgent
                        - recipient
                        - recipientAgent
                        - transaction
                        - paymentRequest
                        additionalProperties: false
                        title: PaymentRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: PaymentResource
                required:
                - data
                additionalProperties: false
                title: PaymentResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: payment
                      id: pay_550e8400e29b41d4a716446655440000
                      attributes:
                        amount: 500000
                        currency: USD
                        status: CANCELED
                        description: Payment for Q4 2025 development work
                        createdAt: '2026-01-04T15:30:00Z'
                        updatedAt: '2026-01-04T15:35:00Z'
                      relationships:
                        sender:
                          data:
                            type: party
                            id: pty_019cd1798d617f65a79cb965dda9eac3
                        senderAgent:
                          data: null
                        recipient:
                          data:
                            type: party
                            id: pty_019cd1798d627ad9bc302511c4f2c115
                        recipientAgent:
                          data: null
                        transaction:
                          data:
                            type: transaction
                            id: txn_550e8400e29b41d4a716446655440000
                        paymentRequest:
                          data: null

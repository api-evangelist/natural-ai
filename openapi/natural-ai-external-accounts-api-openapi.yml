  /external-accounts/{externalAccountId}:
    get:
      operationId: externalAccounts.get
      summary: Get external account
      description: Get a linked external account
      tags:
      - External Accounts
      parameters:
      - name: externalAccountId
        in: path
        required: true
        schema:
          type: string
          pattern: ^eac_[0-9a-f]{32}$
          description: External account ID (eac_*).
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - externalAccount
                      id:
                        type: string
                        pattern: ^eac_[0-9a-f]{32}$
                        description: External account ID (eac_*).
                      attributes:
                        type: object
                        properties:
                          lastFour:
                            type: string
                            description: Last four digits of the external bank account.
                          status:
                            enum:
                            - pending
                            - new
                            - active
                            - disabled
                            - deleted
                            - unknown
                            type: string
                            description: Lifecycle status of the external account.
                          connectionStatus:
                            enum:
                            - active
                            - login_required
                            - disconnected
                            type: string
                            description: Provider connection health for this external account.
                          createdAt:
                            type: string
                            format: date-time
                            description: Time when the external account was linked.
                          bankName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Bank institution name, when available.
                          accountName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Bank account display name, when available.
                          accountType:
                            anyOf:
                            - enum:
                              - checking
                              - savings
                              - unknown
                              type: string
                            - type: 'null'
                            description: Bank account type, when available.
                        required:
                        - lastFour
                        - status
                        - connectionStatus
                        - createdAt
                        - bankName
                        - accountName
                        - accountType
                        additionalProperties: false
                        title: ExternalAccountAttributes
                      relationships:
                        type: object
                        properties:
                          party:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - party
                                  id:
                                    type: string
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            title: ToOneRelationship
                            description: Party that owns the external account.
                        required:
                        - party
                        additionalProperties: false
                        title: ExternalAccountRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: ExternalAccountResource
                required:
                - data
                additionalProperties: false
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: externalAccount
                      id: eac_550e8400e29b41d4a716446655440000
                      attributes:
                        bankName: Chase
                        accountName: Business Checking
                        accountType: checking
                        lastFour: '6789'
                        status: active
                        connectionStatus: active
                        createdAt: '2026-01-04T15:30:00Z'

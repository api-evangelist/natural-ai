      security:
      - HTTPBearer: []
    delete:
      operationId: externalAccounts.remove
      summary: Remove external account
      description: Remove a linked external account
      tags:
      - External Accounts
      parameters:
      - name: externalAccountId
        in: path
        required: true
        schema:
          type: string
          pattern: ^eac_[0-9a-f]{32}$
          description: External account ID (eac_*).
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - externalAccount
                      id:
                        type: string
                        pattern: ^eac_[0-9a-f]{32}$
                        description: External account ID (eac_*).
                      attributes:

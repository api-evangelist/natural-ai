  /payment-requests/{paymentRequestId}/fulfill:
    post:
      operationId: paymentRequests.fulfill
      summary: Fulfill payment request
      description: Fulfill an open payment request from a wallet or a verified linked bank account
      tags:
      - PaymentRequests
      parameters:
      - name: paymentRequestId
        in: path
        required: true
        schema:
          type: string
          pattern: ^prq_[0-9a-f]{32}$
          description: Payment request ID (prq_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partyId:
                  type: string
                  pattern: ^pty_[0-9a-f]{32}$
                  description: Effective payer party ID (pty_*) for delegated payment request fulfillment.
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        paymentSource:
                          anyOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - wallet
                              walletId:
                                type: string
                                pattern: ^wal_[0-9a-f]{32}$
                                description: Wallet used to pay.
                            required:
                            - type
                            - walletId
                            additionalProperties: false
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - external_account
                              externalAccountId:
                                type: string
                                pattern: ^eac_[0-9a-f]{32}$
                                description: Verified linked bank account used to pay.
                            required:
                            - type
                            - externalAccountId
                            additionalProperties: false
                          description: Source of funds for the payment.
                      required:
                      - paymentSource
                      additionalProperties: false
                  required:
                  - attributes
                  additionalProperties: false
              required:
              - data
              additionalProperties: false
            examples:
              default:
                summary: Default
                value:
                  data:
                    attributes:
                      paymentSource:
                        type: wallet
                        walletId: wal_550e8400e29b41d4a716446655440000
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - payment
                      id:
                        type: string
                        pattern: ^pay_[0-9a-f]{32}$
                      attributes:
                        type: object
                        properties:
                          amount:
                            type: integer
                            description: Amount in cents.
                          currency:
                            type: string
                            description: Currency code.
                          status:
                            enum:
                            - CREATED
                            - PROCESSING
                            - PENDING_CLAIM
                            - IN_REVIEW
                            - COMPLETED
                            - FAILED
                            - RETURNED
                            - APPROVAL_DENIED
                            - CANCELED
                            type: string
                            description: Payment status.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Payment description.
                          createdAt:
                            type: string
                            description: When this payment was created.
                          updatedAt:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: When this payment was last updated.
                        required:
                        - amount
                        - currency
                        - status
                        - description
                        - createdAt
                        - updatedAt
                        additionalProperties: false
                        title: PaymentAttributes
                      relationships:
                        type: object
                        properties:
                          sender:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                      pattern: ^pty_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                                - type: 'null'
                            required:
                            - data
                            additionalProperties: false
                            title: NullableToOneRelationship
                            description: Party that initiated the payment, when the sender is on Natural.
                          senderAgent:
                            type: object
                            properties:
                              data:
                                anyOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - agent
                                    id:
                                      type: string
                                      pattern: ^agt_[0-9a-f]{32}$
                                  required:

      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
    get:
      operationId: paymentRequests.list
      summary: List payment requests
      description: List outgoing payment requests
      tags:
      - PaymentRequests
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum results per page.
        allowEmptyValue: true
        allowReserved: true
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
          description: Cursor from the previous page.
        allowEmptyValue: true
        allowReserved: true
      - name: partyId
        in: query
        schema:
          type: string
          pattern: ^pty_[0-9a-f]{32}$
          description: Effective party ID (pty_*) for delegated payment request access.
        allowEmptyValue: true
        allowReserved: true
      - name: includeCompleted
        in: query
        schema:
          anyOf:
          - type: boolean
          - type: string
          default: true
          description: Whether to include completed payment requests.
        allowEmptyValue: true
        allowReserved: true
      - name: includeCanceled
        in: query
        schema:
          anyOf:
          - type: boolean
          - type: string
          default: false
          description: Whether to include canceled payment requests.
        allowEmptyValue: true
        allowReserved: true
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - paymentRequest
                        id:
                          type: string
                          pattern: ^prq_[0-9a-f]{32}$
                          description: Payment request ID (prq_*).
                        attributes:
                          type: object
                          properties:
                            amount:
                              type: integer
                              description: Amount in cents.
                            currency:
                              type: string
                              description: Currency code.
                            status:
                              enum:
                              - OPEN
                              - PROCESSING
                              - COMPLETED
                              - FAILED
                              - RETURNED
                              - CANCELED
                              - DECLINED
                              - EXPIRED
                              type: string
                              description: Payment request status.
                            description:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Free-form description provided at creation. Maximum 80 characters.
                            requesterName:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Display name of the party requesting payment.
                            requesterEmail:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Email of the party requesting payment.
                            requesterAvatarUrl:
                              anyOf:
                              - type: string
                                format: uri
                              - type: 'null'
                              description: Public avatar URL for the party requesting payment, if one is set.
                            requesterHandle:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: The requesting party's composed public handle (@namespace), or null when it has none.
                            walletName:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Receiving wallet name, or null when unnamed or hidden from the caller.
                            payerName:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Display name of the payer.
                            payerEmail:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Email of the payer, or null when none is known.
                            payerAvatarUrl:
                              anyOf:
                              - type: string
                                format: uri
                              - type: 'null'
                              description: Public avatar URL for the payer party, if one is set.
                            payerHandle:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: The resolved payer party's composed public handle (@namespace), or null when off-platform or handle-less.
                            payerPhone:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Payer phone number when addressed by phone.
                            payerPartyId:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Natural party ID (pty_*) resolved for the payer, including agent owner parties.
                            payerIdentifierType:
                              enum:
                              - email
                              - phone
                              - party_id
                              - agent_id
                              - handle
                              type: string
                              description: Identifier type used to address the payer.
                            payerIdentifier:
                              type: string
                              description: Identifier value used to address the payer.
                            initiatorParty:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                    pattern: ^pty_[0-9a-f]{32}$
                                  name:
                                    type: string
                                  handle:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    description: The initiating party's composed public handle (@namespace), or null when it has none.
                                required:
                                - id
                                - name
                                - handle
                                additionalProperties: false
                              - type: 'null'
                              description: The party that created this payment request, or null when unresolved. When an agent created it, this is the agent's owning party.
                            initiatorAgent:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                    pattern: ^agt_[0-9a-f]{32}$
                                  name:
                                    type: string
                                  handle:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    description: The agent's composed public handle (@namespace-slug), or null when it has none.
                                required:
                                - id
                                - name
                                - handle
                                additionalProperties: false
                              - type: 'null'
                              description: Agent that created this payment request, when one did. Otherwise null.
                            paymentLinkUrl:
                              type: string
                              format: uri
                              description: URL the payer visits to complete payment.
                            transactionId:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: ID of the transaction created by the most recent payment attempt, or null if no attempt yet.
                            createdAt:
                              type: string
                              description: When the payment request was created.
                            updatedAt:
                              type: string
                              description: When the payment request was last updated.
                          required:
                          - amount
                          - currency
                          - status
                          - description
                          - requesterName
                          - requesterEmail
                          - requesterAvatarUrl
                          - requesterHandle
                          - walletName
                          - payerName
                          - payerEmail
                          - payerAvatarUrl
                          - payerHandle
                          - payerPhone
                          - payerPartyId
                          - payerIdentifierType
                          - payerIdentifier
                          - initiatorParty
                          - initiatorAgent
                          - paymentLinkUrl
                          - transactionId
                          - createdAt
                          - updatedAt
                          additionalProperties: false
                          title: PaymentRequestAttributes
                        relationships:
                          type: object
                          properties:
                            requesterParty:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - party
                                    id:
                                      type: string
                                      pattern: ^pty_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                              required:
                              - data
                              additionalProperties: false
                              title: ToOneRelationship
                              description: Party requesting the payment.
                            wallet:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - wallet
                                    id:
                                      type: string
                                      pattern: ^wal_[0-9a-f]{32}$
                                  required:
                                  - type
                                  - id
                                  additionalProperties: false
                                  title: ResourceIdentifier
                                  description: Related resource identifier.
                              required:
                              - data
                              additionalProperties: false
                              title: ToOneRelationship
                              description: Wallet that receives the funds.
                            payerParty:
                              type: object
                              properties:
                                data:
                                  anyOf:
                                  - type: object
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - party
                                      id:
                                        type: string
                                        pattern: ^pty_[0-9a-f]{32}$
                                    required:
                                    - type
                                    - id
                                    additionalProperties: false
                                    title: ResourceIdentifier
                                    description: Related resource identifier.
                                  - type: 'null'
                              required:
                              - data
                              additionalProperties: false
                              title: NullableToOneRelationship
                              description: Resolved payer party, if the payer is known to Natural.
                            payerAgent:
                              type: object
                              properties:
                                data:
                                  anyOf:
                                  - type: object
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - agent
                                      id:
                                        type: string
                                        pattern: ^agt_[0-9a-f]{32}$
                                    required:
                                    - type
                                    - id
                                    additionalProperties: false
                                    title: ResourceIdentifier
                                    description: Related resource identifier.
                                  - type: 'null'
                              required:
                              - data

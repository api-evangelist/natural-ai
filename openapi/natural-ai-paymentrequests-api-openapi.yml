  /payment-requests/{paymentRequestId}:
    get:
      operationId: paymentRequests.get
      summary: Get payment request
      description: Get a payment request
      tags:
      - PaymentRequests
      parameters:
      - name: paymentRequestId
        in: path
        required: true
        schema:
          type: string
          pattern: ^prq_[0-9a-f]{32}$
          description: Payment request ID (prq_*).
      - name: partyId
        in: query
        required: false
        schema:
          type: string
          pattern: ^pty_[0-9a-f]{32}$
          description: Effective party ID (pty_*) for delegated payment request access.
        allowEmptyValue: true
        allowReserved: true
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - paymentRequest
                      id:
                        type: string
                        pattern: ^prq_[0-9a-f]{32}$
                        description: Payment request ID (prq_*).
                      attributes:
                        type: object
                        properties:
                          amount:
                            type: integer
                            description: Amount in cents.
                          currency:
                            type: string
                            description: Currency code.
                          status:
                            enum:
                            - OPEN
                            - PROCESSING
                            - COMPLETED
                            - FAILED
                            - RETURNED
                            - CANCELED
                            - DECLINED
                            - EXPIRED
                            type: string
                            description: Payment request status.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Free-form description provided at creation. Maximum 80 characters.
                          requesterName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Display name of the party requesting payment.
                          requesterEmail:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Email of the party requesting payment.
                          requesterAvatarUrl:
                            anyOf:
                            - type: string
                              format: uri
                            - type: 'null'
                            description: Public avatar URL for the party requesting payment, if one is set.
                          requesterHandle:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The requesting party's composed public handle (@namespace), or null when it has none.
                          walletName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Receiving wallet name, or null when unnamed or hidden from the caller.
                          payerName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Display name of the payer.
                          payerEmail:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Email of the payer, or null when none is known.
                          payerAvatarUrl:
                            anyOf:
                            - type: string
                              format: uri
                            - type: 'null'
                            description: Public avatar URL for the payer party, if one is set.
                          payerHandle:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The resolved payer party's composed public handle (@namespace), or null when off-platform or handle-less.
                          payerPhone:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Payer phone number when addressed by phone.
                          payerPartyId:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Natural party ID (pty_*) resolved for the payer, including agent owner parties.
                          payerIdentifierType:
                            enum:
                            - email
                            - phone
                            - party_id
                            - agent_id
                            - handle

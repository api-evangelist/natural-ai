                              description: Agent status.
                            limits:
                              anyOf:
                              - type: object
                                properties:
                                  perTransaction:
                                    anyOf:
                                    - type: integer
                                      exclusiveMinimum: 0
                                    - type: 'null'
                                    description: Per-transaction spending limit in cents, or null for no limit.
                                  perDay:
                                    anyOf:
                                    - type: integer
                                      exclusiveMinimum: 0
                                    - type: 'null'
                                    description: Daily spending limit in cents, or null for no limit.
                                  perMonth:
                                    anyOf:
                                    - type: integer
                                      exclusiveMinimum: 0
                                    - type: 'null'

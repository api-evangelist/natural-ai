  /wallets/{walletId}/default:
    post:
      operationId: wallets.setDefault
      summary: Set default wallet
      description: Make a wallet the default. Payments sent to the party's email, phone number, or handle land in the default wallet.
      tags:
      - Wallets
      parameters:
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          pattern: ^wal_[0-9a-f]{32}$
          description: Wallet ID (wal_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - wallet
                      id:
                        type: string
                        pattern: ^wal_[0-9a-f]{32}$
                        description: Wallet ID (wal_*).
                      attributes:
                        type: object
                        properties:
                          status:
                            enum:
                            - active
                            - frozen
                            - closed
                            type: string
                            description: Wallet readiness status.
                          walletType:
                            enum:
                            - standard
                            - vault
                            type: string
                            description: 'Wallet type: a spendable standard wallet or the vault.'
                          isDefault:
                            type: boolean
                            description: Whether this wallet is the party's default for unnamed operations.
                          createdAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: Wallet creation time, when available.
                          displayName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Wallet name, when set.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: User-facing wallet description, when set.
                          balance:
                            anyOf:
                            - type: object
                              properties:
                                available:
                                  type: integer
                                  description: Amount currently available to spend or withdraw in cents.
                                total:
                                  type: integer
                                  description: Total wallet ledger balance in cents.
                                currency:
                                  enum:
                                  - USD
                                  type: string
                                  description: Currency code.
                              required:
                              - available
                              - total
                              - currency
                              additionalProperties: false
                              title: PublicWalletBalanceAttributes
                            - type: 'null'
                            description: Wallet ledger balance, when available.
                          claims:
                            type: object
                            properties:
                              amount:
                                type: integer
                                description: Total unclaimed product-payment amount in cents.
                              count:
                                type: integer
                                description: Number of unclaimed product payments.
                            required:
                            - amount
                            - count
                            additionalProperties: false
                            title: WalletClaims
                            description: Party-level claimable payment totals, surfaced on the default wallet (or the first wallet when none is default).
                          depositInstructions:
                            anyOf:
                            - type: object
                              properties:
                                bankName:
                                  type: string
                                  description: Name of the receiving bank.
                              required:
                              - bankName
                              additionalProperties: false
                              title: PublicDepositInstructionsAttributes
                            - type: 'null'
                            description: Receiving bank for ACH deposits to this wallet, when available.
                        required:
                        - status
                        - walletType
                        - isDefault
                        - createdAt
                        - displayName
                        - description
                        - balance
                        - claims
                        - depositInstructions
                        additionalProperties: false
                        title: WalletAttributes
                      relationships:
                        type: object
                        properties:
                          party:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - party
                                  id:
                                    type: string
                                required:
                                - type
                                - id
                                additionalProperties: false
                                title: ResourceIdentifier
                                description: Related resource identifier.
                            required:
                            - data
                            additionalProperties: false
                            title: ToOneRelationship
                            description: Party that owns the wallet.
                        required:
                        - party
                        additionalProperties: false
                        title: WalletRelationships
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    title: WalletResource
                required:
                - data
                additionalProperties: false
                title: WalletResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: wallet
                      id: wal_550e8400e29b41d4a716446655440000
                      attributes:
                        status: active
                        walletType: standard
                        isDefault: true
                        createdAt: '2026-01-04T15:30:00Z'
                        displayName: Operating
                        description: null
                        balance: null
                        claims:
                          amount: 0

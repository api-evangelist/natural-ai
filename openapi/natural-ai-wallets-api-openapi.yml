    post:
      operationId: wallets.unfreeze
      summary: Unfreeze wallet
      description: Unfreeze a wallet that was frozen through the API
      tags:
      - Wallets
      parameters:
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          pattern: ^wal_[0-9a-f]{32}$

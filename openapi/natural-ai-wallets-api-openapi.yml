  /wallets/{walletId}/agents/{agentId}:
    delete:
      operationId: wallets.detachAgent
      summary: Detach agent from wallet
      description: Detach an agent from a wallet
      tags:
      - Wallets
      parameters:
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          pattern: ^wal_[0-9a-f]{32}$
          description: Wallet ID (wal_*).
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^agt_[0-9a-f]{32}$
          description: Agent ID (agt_*).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
        description: Unique key for safely retrying a request without creating duplicates.
      - name: X-Agent-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 36
            pattern: ^agt_[0-9a-f]{32}$
          - type: 'null'
        description: Agent (agt_*) to attribute this request to when authenticating with a party API key; omit for agent keys and agent-scoped OAuth grants, which already carry agent identity.
      - name: X-Instance-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        description: Caller-chosen identifier for the agent run, session, or conversation, required when an agent moves money.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - agent
                      id:
                        type: string
                        pattern: ^agt_[0-9a-f]{32}$
                        description: Agent ID (agt_*).
                    required:
                    - type
                    - id
                    additionalProperties: false
                    title: WalletAgentDetachedResource
                  meta:
                    type: object
                    properties:
                      deleted:
                        const: true
                        description: Indicates the resource was deleted.
                    required:
                    - deleted
                    additionalProperties: false
                    title: DeletedMeta
                required:
                - data
                - meta
                additionalProperties: false
                title: WalletAgentDetachResponse
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      type: agent
                      id: agt_3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
                    meta:
                      deleted: true
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window.

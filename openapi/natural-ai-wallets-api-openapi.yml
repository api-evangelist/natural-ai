                value:
                  data:
                    attributes:
                      displayName: Payroll
                      description: Dedicated wallet for payroll runs
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - wallet
                      id:
                        type: string
                        pattern: ^wal_[0-9a-f]{32}$
                        description: Wallet ID (wal_*).
                      attributes:
                        type: object
                        properties:
                          status:
                            enum:
                            - active
                            - frozen
                            - closed
                            type: string
                            description: Wallet readiness status.
                          walletType:
                            enum:
                            - standard
                            - vault
                            type: string
                            description: 'Wallet type: a spendable standard wallet or the vault.'
                          isDefault:
                            type: boolean
                            description: Whether this wallet is the party's default for unnamed operations.
                          createdAt:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                            description: Wallet creation time, when available.
                          displayName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Wallet name, when set.
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: User-facing wallet description, when set.
                          balance:
                            anyOf:
                            - type: object
                              properties:
                                available:
                                  type: integer
                                  description: Amount currently available to spend or withdraw in cents.
                                total:
                                  type: integer
                                  description: Total wallet ledger balance in cents.
                                currency:
                                  enum:

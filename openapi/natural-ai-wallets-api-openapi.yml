                          total: 125000
                          currency: USD
                        claims:
                          amount: 125000
                          count: 2
                        depositInstructions:
                          bankName: Bridge Financial
                      relationships:
                        party:
                          data:
                            type: party
                            id: pty_7c9e6679e29b41d4a716446655440001
                    - type: wallet
                      id: wal_650e8400e29b41d4a716446655440000
                      attributes:
                        status: active
                        walletType: vault
                        isDefault: false
                        createdAt: '2026-01-04T15:30:00Z'
                        displayName: Vault
                        description: null
                        balance:
                          available: 500000
                          total: 500000
                          currency: USD
                        claims:
                          amount: 0
                          count: 0
                        depositInstructions:
                          bankName: Bridge Financial
                      relationships:
                        party:
                          data:
                            type: party
                            id: pty_7c9e6679e29b41d4a716446655440001
                    meta:
                      pagination:
                        hasMore: false
                        nextCursor: null
